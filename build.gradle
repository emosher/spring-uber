plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.8'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.gorylenko.gradle-git-properties' version '2.5.3'
	id 'com.github.node-gradle.node' version '7.1.0'
}

group = 'dev.emosher'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
	gradlePluginPortal()
	mavenCentral()
}

bootJar {
  	mainClass.set('dev.emosher.springuber.SpringUberApplication')
}

// Ensure Java 21 is used
tasks.withType(JavaCompile) {
    options.release = 21
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.postgresql:postgresql'
    implementation 'com.opencsv:opencsv:5.7.1'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Node/NPM configuration
node {
	version = '22.12.0'
	npmVersion = '10.9.2'
	download = true
	nodeProjectDir = file("${project.projectDir}")
}

// Copy NPM dependencies to static resources
task copyFrontendDependencies(type: Copy) {
	dependsOn 'npmInstall'
	from 'node_modules/apexcharts/dist'
	into 'src/main/resources/static/js/vendor'
	include 'apexcharts.min.js'
}

// Ensure frontend dependencies are copied before processing resources
processResources {
	dependsOn copyFrontendDependencies
}

// Clean up generated frontend files
clean {
	delete 'node_modules'
	delete 'src/main/resources/static/js/vendor/apexcharts.min.js'
}

task listRepos {
    doLast {
        println "Repositories:"
        project.repositories.each {
            if (it instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository) {
                println "  Name: ${it.name}; url: ${it.url}"
            } else {
                println "  Name: ${it.name}; type: ${it.class.simpleName}"
            }
        }
    }
}
